services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
      POSTGRES_DB: civicpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://civicpulse:civicpulse@postgres:5432/civicpulse
    depends_on:
      - postgres

volumes:
  pgdata: